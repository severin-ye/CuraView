models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: qwen-plus
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    model_supports_json: true
    concurrent_requests: 25
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null
  default_embedding_model:
    type: embedding
    model_provider: openai
    auth_type: api_key
    api_key: ${GRAPHRAG_API_KEY}
    model: text-embedding-v3
    api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
    concurrent_requests: 25
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null
input:
  storage:
    type: file
    base_dir: input
  file_type: json
  file_pattern: 'documents[.]json$$'
  title_column: title
chunks:
  size: 1200
  overlap: 100
  group_by_columns:
  - id
output:
  type: file
  base_dir: output
cache:
  type: file
  base_dir: cache
reporting:
  type: file
  base_dir: logs
vector_store:
  default_vector_store:
    type: lancedb
    db_uri: output/lancedb
    container_name: default
embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store
  batch_size: 9
extract_graph:
  model_id: default_chat_model
  prompt: prompts/domain/extract_graph.txt
  entity_types:
  - organization
  - person
  - geo
  - event
  max_gleanings: 1
summarize_descriptions:
  model_id: default_chat_model
  prompt: prompts/domain/summarize_descriptions.txt
  max_length: 500
extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
  async_mode: threaded
cluster_graph:
  max_cluster_size: 10
extract_claims:
  enabled: false
  model_id: default_chat_model
  prompt: prompts/domain/extract_claims.txt
  description: Any claims or facts that could be relevant to information discovery.
  max_gleanings: 1
community_reports:
  model_id: default_chat_model
  graph_prompt: prompts/domain/community_report_graph.txt
  text_prompt: prompts/domain/community_report_text.txt
  max_length: 2000
  max_input_length: 8000
embed_graph:
  enabled: false
umap:
  enabled: false
snapshots:
  graphml: false
  embeddings: false
local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: prompts/domain/local_search_system_prompt.txt
global_search:
  chat_model_id: default_chat_model
  map_prompt: prompts/domain/global_search_map_system_prompt.txt
  reduce_prompt: prompts/domain/global_search_reduce_system_prompt.txt
  knowledge_prompt: prompts/domain/global_search_knowledge_system_prompt.txt
drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: prompts/domain/drift_search_system_prompt.txt
  reduce_prompt: prompts/domain/drift_reduce_prompt.txt
basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: prompts/domain/basic_search_system_prompt.txt
